[tox]
# Python x scikit-learn matrix. Only combinations for which scikit-learn
# publishes binary wheels are listed (latest patch release of each minor).
envlist =
    py{39,310,311}-sklearn12
    py{39,310,311,312}-sklearn{13,14}
    py{39,310,311,312,313}-sklearn{15,16}
    py{310,311,312,313,314}-sklearn17
    py{311,312,313,314}-sklearn{18,19}
skip_missing_interpreters = true

[testenv]
deps =
    sklearn12: scikit-learn~=1.2.0
    sklearn13: scikit-learn~=1.3.0
    sklearn14: scikit-learn~=1.4.0
    sklearn15: scikit-learn~=1.5.0
    sklearn16: scikit-learn~=1.6.0
    sklearn17: scikit-learn~=1.7.0
    sklearn18: scikit-learn~=1.8.0
    sklearn19: scikit-learn~=1.9.0
    # scikit-learn < 1.4.2 is built against NumPy 1.x
    sklearn{12,13}: numpy<2
    # scipy 1.15.x py310 macOS wheels fail to load on recent macOS (dyld rejects _spropack)
    py310: scipy<1.15
setenv =
    # never compile numerical libraries from source
    PIP_ONLY_BINARY = numpy,scipy,scikit-learn
commands =
    python -c "import sys, sklearn, numpy; print('python', sys.version.split()[0], 'sklearn', sklearn.__version__, 'numpy', numpy.__version__)"
    python -m unittest discover -p '*_test.py' -v -s tests -t {toxinidir}
